appId: dev.agenticpersona.app
productName: Agentic Persona
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.productivity
linux:
  target:
    - AppImage
  category: Office
